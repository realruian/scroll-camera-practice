<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>滚动运镜练习</title>
<style>
  html, body { margin: 0; background: #1a1612; }
  /* 画布固定在屏幕上，页面本身只提供滚动距离 */
  #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #scroll { height: 900vh; }
  #hud {
    position: fixed; left: 16px; bottom: 16px; z-index: 2;
    font: 12px/1.4 ui-monospace, Menlo, monospace; color: #f4efe6;
    background: rgba(0,0,0,.45); padding: 6px 10px; border-radius: 6px;
    font-variant-numeric: tabular-nums;
  }
  #bar { position: fixed; left: 0; top: 0; height: 2px; background: #f4efe6; z-index: 2; width: 0; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="stage"></canvas>
<div id="bar"></div>
<div id="hud">加载中…</div>
<div id="scroll"></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const LIBS = 'https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/libs/';
const SMOOTH = 0.08;          // 滚动阻尼，越小越"粘"
const hud = document.getElementById('hud');
const bar = document.getElementById('bar');

const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('stage'), antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(25.4, 16 / 9, 0.1, 1000);

// 反射用的环境光（背景是不受光材质，只有金属/塑料件会用到）
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const ktx2 = new KTX2Loader().setTranscoderPath(LIBS + 'basis/').detectSupport(renderer);
const draco = new DRACOLoader().setDecoderPath(LIBS + 'draco/gltf/');
const loader = new GLTFLoader().setDRACOLoader(draco).setKTX2Loader(ktx2);

// 三个模型共用同一个坐标系，直接叠在一起即可
const [env, mg, hub, state, domeTex] = await Promise.all([
  loader.loadAsync('assets/env.glb'),   // 拱廊、穹顶、柱子 + 相机动画
  loader.loadAsync('assets/mg.glb'),    // 柜台、背景墙、平板、扫码枪、读卡器、线缆
  loader.loadAsync('assets/hub.glb'),   // 主角：以后换成自己的模型，改这一行
  fetch('assets/theatre-state.json').then((r) => r.json()),   // 原站的关键帧
  ktx2.loadAsync('assets/dome.ktx2').catch(() => null),       // 穹顶天顶画
]);
scene.add(env.scene, mg.scene, hub.scene);

// 用文件里自带的相机，运镜已经做在动画里
if (env.cameras.length) camera = env.cameras[0];
const BASE_FOV = camera.fov;

// 穹顶天顶画：模型里只留了一个空的定位点 dome-cap，贴图要自己挂上去
const domeCap = env.scene.getObjectByName('dome-cap');
if (domeCap && domeTex) {
  domeTex.colorSpace = THREE.SRGBColorSpace;
  const disc = new THREE.Mesh(new THREE.CircleGeometry(1, 64),
    new THREE.MeshBasicMaterial({ map: domeTex, side: THREE.DoubleSide }));
  disc.rotation.x = Math.PI / 2;        // 朝下
  domeCap.add(disc);
}

/* ---------- 关键帧取值（原站用 Theatre.js，这里自己算贝塞尔） ---------- */
const seq = state.sheetsById.Scene.sequence;
const LENGTH = seq.length;                                   // 整段 9.54 个单位
const trackOf = {};
for (const [obj, o] of Object.entries(seq.tracksByObject))
  for (const t of Object.values(o.trackData)) trackOf[t.__debugName] = t.keyframes;

function bezier(x1, y1, x2, y2, x) {                         // 解三次贝塞尔缓动
  let lo = 0, hi = 1, u = x;
  for (let i = 0; i < 24; i++) {
    u = (lo + hi) / 2;
    const bx = 3 * (1 - u) * (1 - u) * u * x1 + 3 * (1 - u) * u * u * x2 + u * u * u;
    if (bx < x) lo = u; else hi = u;
  }
  return 3 * (1 - u) * (1 - u) * u * y1 + 3 * (1 - u) * u * u * y2 + u * u * u;
}
function key(name, T, fallback = 0) {
  const ks = trackOf[name];
  if (!ks || !ks.length) return fallback;
  if (T <= ks[0].position) return ks[0].value;
  const last = ks[ks.length - 1];
  if (T >= last.position) return last.value;
  let i = 0; while (T > ks[i + 1].position) i++;
  const a = ks[i], b = ks[i + 1];
  const x = (T - a.position) / (b.position - a.position);
  return a.value + (b.value - a.value) * bezier(a.handles[2], a.handles[3], b.handles[0], b.handles[1], x);
}
const P = (obj, ...path) => `${obj}:${JSON.stringify(path)}`;

/* ---------- 模型自带动画：进度由关键帧决定，不是匀速 ---------- */
const clipPlayer = (g) => {
  const mixer = new THREE.AnimationMixer(g.scene), clip = g.animations[0];
  mixer.clipAction(clip).play();
  return (progress) => mixer.setTime(Math.min(Math.max(progress, 0), 1) * (clip.duration - 1e-3));
};
const playEnv = clipPlayer(env), playMg = clipPlayer(mg), playHub = clipPlayer(hub);

// 柜台那一组在结尾会淡出，露出穹顶
const mgMats = new Set();
mg.scene.traverse((o) => { if (o.material) [].concat(o.material).forEach((m) => mgMats.add(m)); });
function fadeMg(v) {
  mg.scene.visible = v > 0.01;
  for (const m of mgMats) { m.transparent = v < 0.999; m.opacity = v; }
}

/* ---------- 主角 ----------
   原站坐标：环境组放大 3 倍并整体平移；这里统一换算回模型自己的坐标系。
   开场悬浮那一段原站的机位没能还原，改成"固定在镜头前"的写法。
   换成自己的模型时，主要调 FLOAT 这组数。 */
const hero = hub.scene;
const SCALE = 3;
const FLOAT = { pos: new THREE.Vector3(0.0, -0.035, -0.34), rot: new THREE.Euler(0.62, 0.5, 0.08) }; // 相对相机
const FLY = [1.3, 4.333];                                    // 这段时间内从悬浮飞到停靠位
const LEAVE = [4.9, 6.8];                                    // 这段时间内离开停靠位、飞到镜头前
const SHOW = {                                               // 结尾亮相的姿态，相对相机
  pos: new THREE.Vector3(0.05, -0.012, -0.24),
  quat: new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -1.05)
    .multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), -0.8)),
};
const SPIN_AXIS = new THREE.Vector3(0.3, 1, 0.2).normalize();
const pShow = new THREE.Vector3(), qShow = new THREE.Quaternion();

const smooth = (a, b, x) => { const u = Math.min(1, Math.max(0, (x - a) / (b - a))); return u * u * (3 - 2 * u); };
const qFloat = new THREE.Quaternion(), qData = new THREE.Quaternion(), qSpin = new THREE.Quaternion();
const camQ = new THREE.Quaternion(), pFloat = new THREE.Vector3(), pData = new THREE.Vector3();
const eul = new THREE.Euler(), UP = new THREE.Vector3(0, 1, 0);

function heroFromData(T) {                                   // 原站关键帧 → 模型坐标
  const ex = key(P('asset-1', 'position', 'x'), T), ey = key(P('asset-1', 'position', 'y'), T), ez = key(P('asset-1', 'position', 'z'), T);
  pData.set(
    (key(P('asset-2', 'position', 'x'), T) - ex) / SCALE,
    (key(P('asset-2', 'position', 'y'), T) - ey) / SCALE,
    (key(P('asset-2', 'position', 'z'), T) - ez) / SCALE);
  eul.set(key(P('asset-2', 'rotation', 'x'), T), key(P('asset-2', 'rotation', 'y'), T), key(P('asset-2', 'rotation', 'z'), T));
  qData.setFromEuler(eul);
}

function placeHero(T, time) {
  heroFromData(Math.max(T, FLY[1]));                         // 停靠之后完全照原站数据走
  const s = smooth(FLY[0], FLY[1], T), idle = 1 - s;
  camera.updateMatrixWorld(true);
  camera.getWorldQuaternion(camQ);
  pFloat.copy(FLOAT.pos); pFloat.y += Math.sin(time * 1.2) * 0.004 * idle;   // 悬浮时轻微漂动
  camera.localToWorld(pFloat);
  qFloat.setFromEuler(FLOAT.rot).premultiply(camQ);
  qSpin.setFromAxisAngle(UP, Math.sin(time * 0.6) * 0.12 * idle + Math.sin(s * Math.PI) * 1.2);
  hero.position.lerpVectors(pFloat, pData, s);
  hero.quaternion.slerpQuaternions(qFloat, qData, s).premultiply(qSpin);

  // 结尾：离开停靠位，翻到镜头前亮出底面（同样固定在镜头前）
  const e = smooth(LEAVE[0], LEAVE[1], T);
  if (e > 0) {
    pShow.copy(SHOW.pos); pShow.y += Math.sin(time * 1.1) * 0.003 * e;
    camera.localToWorld(pShow);
    qShow.copy(camQ).multiply(SHOW.quat);
    qSpin.setFromAxisAngle(SPIN_AXIS, Math.sin(e * Math.PI) * 1.4 + Math.sin(time * 0.5) * 0.08 * e);
    hero.position.lerp(pShow, e);
    hero.quaternion.slerp(qShow, e).multiply(qSpin);
  }
}

function apply(p, time = 0) {
  const T = p * LENGTH;
  playEnv(key(P('asset-1', 'animations', 'Scene', 'progress'), T));
  playMg(key(P('asset-3', 'animations', 'Scene', 'progress'), T));
  playHub(key(P('asset-2', 'animations', 'Scene', 'progress'), T));
  // 柜台淡出：收窄到一小段，避免停靠画面里柜台半透明
  fadeMg(smooth(0.15, 0.6, key(P('asset-3', 'visibility'), T, 1)));
  // 结尾镜头变广角（按原站 fov 曲线的比例放大模型相机自带的视角）
  const fov = BASE_FOV * Math.max(1, key(P('camera', 'fov'), T, 30) / 30);
  if (Math.abs(fov - camera.fov) > 1e-3) { camera.fov = fov; camera.updateProjectionMatrix(); }
  placeHero(T, time);
  return T;
}

function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();

const target = () => {
  const max = document.documentElement.scrollHeight - innerHeight;
  return max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 0;
};
// ?p=0.3 可以直接跳到某个进度，方便调试
const forced = new URLSearchParams(location.search).get('p');
let progress = forced !== null ? Number(forced) : target();

renderer.setAnimationLoop(() => {
  if (forced === null) progress += (target() - progress) * SMOOTH;
  const T = apply(progress, forced === null ? performance.now() / 1000 : 0);
  renderer.render(scene, camera);
  bar.style.width = (progress * 100).toFixed(2) + '%';
  hud.textContent = `进度 ${(progress * 100).toFixed(1)}%  ·  时间轴 ${T.toFixed(2)} / ${LENGTH}`;
});
window.__ready = true;
</script>
</body>
</html>
